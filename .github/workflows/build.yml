name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # нужно, чтобы выложить APK в Releases
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: SotaToggle-apk
          path: app/build/outputs/apk/debug/*.apk

      # Постоянная ссылка на свежий APK:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/SotaToggle.apk
      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SotaToggle.apk
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create latest SotaToggle.apk -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sota Toggle — последняя сборка" \
            --notes "Сборка из коммита ${GITHUB_SHA::7}. Перед установкой новой версии удали старую."
